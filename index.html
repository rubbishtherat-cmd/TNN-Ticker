<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TNN Ticker</title>

<style>

html,body{
margin:0;
overflow:hidden;
background:transparent;
width:100%;
height:100%;
}

body{
display:flex;
align-items:center;
font-family:Arial,Helvetica,sans-serif;
}

#ticker{

display:inline-block;

white-space:nowrap;

font-size:34px;

font-weight:900;

color:white;

text-shadow:
2px 2px 5px #000,
0 0 10px #000;

padding-left:100%;

animation:scroll 200s linear infinite;

}

@keyframes scroll{

0%{
transform:translateX(0%);
}

100%{
transform:translateX(-100%);
}

}

</style>
</head>

<body>

<div id="ticker"></div>

<script>

const headlines=[

"🚨 DISCLAIMER • Rubbish T. Rat is fictional. TNN is not a real news network, obviously. . .",

"💬 COMMUNITY • Join The Rubbish Bin on Discord • Come hang out with the rats, share your nonsense, and find Rubbish when he's off the air.",

"📰 BREAKING • Dumpster declared historical landmark after further review.",

"🐀 RAT FACT • Confidence increases by 83% when wearing a stained tank top.",

"🗑 WEATHER • Sunny, but not performative.",

"📺 TNN EXCLUSIVE • Scientists confirm stolen food tastes better.",

"🚔 CRIME WATCH • Local cheddar supplies dwindling. Suspect remains adorable.",

"💰 MARKET WATCH • Aluminum cans ▲12% • Pizza crust futures remain stable.",

"❤️ HEALTH • Hydrate occasionally. Energy drinks are not water.",

"🎙 LIVE • Broadcasting from your local dumpster.",

"❤️ SUPPORT • Join Rubbish on Patreon • Get closer to the Rat, support the show, and help keep the dumpster lights on.",
  
"☕ SUPPORT • Buy Rubbish a Coffee • If you enjoy the show and want to keep the Rat fed, and watered. - BMAC",
  
"🎤 CAMEO • Want Rubbish's voice for yourself? Cameo requests are available.",

];

function shuffle(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

}

function buildTicker(){

shuffle(headlines);

let text="";

headlines.forEach(item=>{

text+=item+" ✦ ";

});

document.getElementById("ticker").innerHTML=text.repeat(3);

}

buildTicker();

</script>

</body>
</html>
